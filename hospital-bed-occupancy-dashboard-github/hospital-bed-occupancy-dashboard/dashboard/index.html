 let O=0,C=0,pk=0,rows=[];for(const i of days){const[o,c]=occ(i,idx),p=100*o/c;O+=o;C+=c;if(p>=90)pk++;rows.push({i,o,c,p})}
 let ls=0,ln=0,sd=0;for(const k in D.los){const[dk,mo]=k.split("|");if(idx.includes(+dk)&&(m==="all"||mo===m)){const v=D.los[k];ls+=v[0];ln+=v[1];sd+=v[2]}}
 const cd=[["Occupancy %",(100*O/C).toFixed(1)+"%"],["Avg length of stay",(ls/ln).toFixed(2)+" days"],["Same-day discharge",(100*sd/ln).toFixed(1)+"%"],["Peak days (>=90%)",pk],["Completed stays",ln.toLocaleString()]];
 $("cards").innerHTML=cd.map(c=>`<div class="card"><b>${c[1]}</b><span>${c[0]}</span></div>`).join("");
 const mv=months.map(mo=>{let o=0,c=0;dates.forEach((d,i)=>{if(d.startsWith(mo)){const r=occ(i,idx);o+=r[0];c+=r[1]}});return 100*o/c});
 line($("c1"),months,mv,m==="all"?undefined:m);
 const dv=D.depts.map((d,k)=>{let o=0,c=0;for(const i of days){o+=d.occ[i];c+=d.cap}return 100*o/c});
 bars($("c2"),D.depts.map(d=>d.n),dv,$("dept").value==="all"?-1:+$("dept").value);
 $("t3").textContent="Daily occupancy % - "+($("dept").value==="all"?"all departments":D.depts[+$("dept").value].n)+" - "+(m==="all"?"all months":m);
 line($("c3"),days.map(i=>dates[i]),rows.map(r=>r.p));
 const top=[...rows].sort((a,b)=>b.p-a.p).slice(0,10);
 $("peak").innerHTML="<tr><th>Date</th><th>Day</th><th>Occupied / Capacity</th><th>Occupancy %</th></tr>"+top.map(r=>`<tr><td>${dates[r.i]}</td><td>${new Date(dates[r.i]).toUTCString().slice(0,3)}</td><td>${r.o} / ${r.c}</td><td>${r.p.toFixed(1)}%</td></tr>`).join("")}
$("c1").onclick=e=>{const cv=$("c1"),x=e.offsetX;let b=0;cv._pts.forEach((p,i)=>{if(Math.abs(p-x)<Math.abs(cv._pts[b]-x))b=i});$("month").value=months[b];render()};
$("c2").onclick=e=>{const k=Math.floor((e.offsetY-4)/26);if(k>=0&&k<D.depts.length){$("dept").value=k;render()}};
$("dept").onchange=$("month").onchange=render;$("reset").onclick=()=>{$("dept").value=$("month").value="all";render()};
addEventListener("resize",render);render();
</script></body></html>
